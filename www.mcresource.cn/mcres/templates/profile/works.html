<!-- profile/works.html -->
<div class="card works-card">
    <div class="works-layout">
        <!-- 左侧侧边栏 -->
        <div class="works-sidebar">
            <div class="works-sidebar-header">
                <i class="fas fa-folder-open" style="color: var(--role-color);"></i>
                <span>{% if is_me %}我的作品{% else %}TA的作品{% endif %}</span>
                <span class="works-total-badge" id="works-total">0</span>
            </div>
            <div class="works-submenu">
                <button class="works-sub-btn active" data-type="resourcepack">
                    <i class="fas fa-cube"></i>
                    <span class="sub-label">资源包</span>
                    <span class="sub-count" id="count-resourcepack">0</span>
                </button>
                <button class="works-sub-btn" data-type="shaderpack">
                    <i class="fas fa-palette"></i>
                    <span class="sub-label">光影包</span>
                    <span class="sub-count" id="count-shaderpack">0</span>
                </button>
                <button class="works-sub-btn" data-type="map">
                    <i class="fas fa-map"></i>
                    <span class="sub-label">地图</span>
                    <span class="sub-count" id="count-map">0</span>
                </button>
            </div>
        </div>

        <!-- 右侧内容区 -->
        <div class="works-content">
            <div id="works-resourcepack" class="works-sub-content active">
                <div class="works-grid" id="works-list-resourcepack">
                    <div class="empty-state">
                        <i class="fas fa-cube" style="color: var(--role-color); opacity:0.3;"></i>
                        <p>还没有发布过资源包，去创作吧！</p>
                    </div>
                </div>
            </div>
            <div id="works-shaderpack" class="works-sub-content">
                <div class="works-grid" id="works-list-shaderpack">
                    <div class="empty-state">
                        <i class="fas fa-palette" style="color: var(--role-color); opacity:0.3;"></i>
                        <p>还没有发布过光影包，去创作吧！</p>
                    </div>
                </div>
            </div>
            <div id="works-map" class="works-sub-content">
                <div class="works-grid" id="works-list-map">
                    <div class="empty-state">
                        <i class="fas fa-map" style="color: var(--role-color); opacity:0.3;"></i>
                        <p>还没有发布过地图，去创作吧！</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 嵌入后端数据 -->
