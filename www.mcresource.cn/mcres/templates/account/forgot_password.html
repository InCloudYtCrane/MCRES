{% extends "base.html" %} {% block title %}重置密码 - MCRES{% endblock %} {%
block extra_head %}
<link rel="stylesheet" href="/static/css/pages/auth/forgot.css" />
{% endblock %} {# 该页无 footer #} {% block footer %}{% endblock %} {% block
content %}
<div class="wrapper">
  <div class="reset-card">
    <h2><i class="fas fa-key"></i> 重置密码</h2>
    <div class="sub">输入您的注册邮箱，我们将发送验证码到您的邮箱</div>
    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>
    <form action="/reset_password" method="post" id="resetForm">
      <div class="form-group">
        <label for="emailInput"><i class="fas fa-envelope"></i> 邮箱</label>
        <input
          type="email"
          name="email"
          id="emailInput"
          placeholder="请输入注册邮箱"
          required
        />
      </div>
      <div class="form-group">
        <label><i class="fas fa-shield-alt"></i> 图形验证码</label>
        <div class="captcha-row">
          <input
            type="text"
            name="captcha"
            id="captchaInput"
            placeholder="请输入图形验证码"
            required
          />
          <img
            src="/captcha"
            id="captchaImg"
            class="captcha-img"
            title="点击刷新"
          />
        </div>
        <div class="captcha-refresh">
          <a
            >看不清？换一张</a
          >
        </div>
      </div>
      <div class="form-group">
        <label for="emailCodeInput"
          ><i class="fas fa-envelope-open-text"></i> 邮箱验证码</label
        >
        <div class="email-code-row">
          <input
            type="text"
            name="email_code"
            id="emailCodeInput"
            placeholder="请输入邮箱验证码"
            required
          />
          <button type="button" class="email-code-btn" id="sendCodeBtn">
            <i class="fas fa-paper-plane"></i> 发送验证码
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="newPwd"><i class="fas fa-lock"></i> 新密码</label>
        <input
          type="password"
          id="newPwd"
          name="new_password"
          placeholder="请输入新密码（至少8位）"
          required
        />
      </div>
      <div class="form-group">
        <label for="confirmPwd"><i class="fas fa-lock"></i> 确认新密码</label>
        <input
          type="password"
          id="confirmPwd"
          name="confirm_password"
          placeholder="请再次输入新密码"
          required
        />
      </div>
      <span style="color: red">{{ error }}</span>
      <button type="submit" class="reset-btn">
        <i class="fas fa-check-circle"></i> 重置密码
      </button>
    </form>
    <div class="login-link">
      <i class="fas fa-arrow-left"></i> 返回 <a href="/login">登录页面</a>
    </div>
  </div>
</div>
{% endblock %} {% block extra_script %}
<script src="/static/js/pages/auth/forgot_password.js"></script>
{% endblock %}
